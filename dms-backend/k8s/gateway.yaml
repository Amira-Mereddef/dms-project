apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: dms
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }

    http {
      upstream backend {
        server backend-service:4000;
      }

      server {
        listen 80;

        # Health check
        location /health {
          proxy_pass http://backend/health;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
        }

        # Metrics (internal only)
        location /metrics {
          proxy_pass http://backend/metrics;
          proxy_set_header Host $host;
        }

        # All API traffic
        location /api/ {
          proxy_pass http://backend/api/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Authorization $http_authorization;
          proxy_read_timeout 60s;
        }

        # Block direct access to anything else
        location / {
          return 404 '{"error":"Not found"}';
          add_header Content-Type application/json;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: dms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: dms
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080