apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-backend
  namespace: dms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dms-backend
  template:
    metadata:
      labels:
        app: dms-backend
    spec:
      containers:
        - name: dms-backend
          image: dms-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: dms-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: JWT_SECRET
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: PG_PASSWORD
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: S3_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: dms
spec:
  selector:
    app: dms-backend
  ports:
    - port: 4000
      targetPort: 4000