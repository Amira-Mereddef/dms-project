services:

  postgres:
    image: postgres:15
    container_name: dms_postgres
    environment:
      - POSTGRES_USER=dms
      - POSTGRES_PASSWORD=dms123
      - POSTGRES_DB=dmsdb
    ports:
      - "5433:5432"
    volumes:
      - dms_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dms_redis
    ports:
      - "6379:6379"

  cassandra:
    image: cassandra:4.1
    container_name: dms_cassandra
    ports:
      - "9042:9042"
    volumes:
      - dms_cassandra_data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=dms_cluster

  minio:
    image: minio/minio
    container_name: dms_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - dms_minio_data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: dms_zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: dms_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 1

  prometheus:
    image: prom/prometheus:latest
    container_name: dms_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: dms_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - dms_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  dms_postgres_data:
  dms_cassandra_data:
  dms_minio_data:
  dms_grafana_data: